name: Build Release

# Produces the two artifacts that matter: a Windows .exe installer and an
# Android .apk.
#
# This is based on the workflow that previously worked in this repo
# (.github/workflows/build-release.yml, removed in f0659ad) rather than a
# hand-rolled build, because that one was known to produce working artifacts.
# The important details carried over from it:
#   - `pnpm --filter <pkg> run build`, not `cd <dir> && pnpm run build`.
#     The cd form does not resolve workspace binaries on a clean CI install.
#   - `tauri android build` via the Tauri CLI, rather than driving cargo-ndk
#     and Gradle by hand.
#   - NDK 27.0.12077973, the version this project is known to build against.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe / .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/host/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/host imports @karaokenatin/shared by package main, so this has to
      # produce dist/ before the frontend will typecheck.
      - name: Build shared package
        run: pnpm --filter @karaokenatin/shared run build

      - name: Build host frontend
        run: pnpm --filter @karaokenatin/host run build

      - name: Build Tauri app
        run: pnpm --filter @karaokenatin/host run tauri:build

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-exe
          path: apps/host/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-msi
          path: apps/host/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/host/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @karaokenatin/shared run build

      - name: Build host frontend
        run: pnpm --filter @karaokenatin/host run build

      - name: Initialize Android project
        working-directory: apps/host
        run: npx tauri android init --skip-targets-install

      # `android init` regenerates gen/android. Two files there carry hand
      # edits that must survive: the trimmed permission set, and the network
      # security config (the app talks plain HTTP to a LAN IP, so cleartext is
      # load-bearing — see the comments in that file). Restoring them from git
      # makes the build independent of whatever init decides to write.
      - name: Restore hand-edited Android config
        run: |
          git checkout -- \
            apps/host/src-tauri/gen/android/app/src/main/AndroidManifest.xml \
            apps/host/src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml
          echo "--- permissions in effect ---"
          grep 'uses-permission' apps/host/src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        working-directory: apps/host
        run: npx tauri android build

      - name: Locate APKs
        run: find apps/host/src-tauri/gen/android -name '*.apk' -print

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/host/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
